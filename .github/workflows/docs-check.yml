name: docs-check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest==9.2.0
      - run: python -m pytest .github/scripts/tests -q
      - run: python .github/scripts/check_docs.py contracts.md decisions.md README.md
